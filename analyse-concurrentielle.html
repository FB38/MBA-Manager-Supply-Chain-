<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’analyse concurrentielle et le positionnement stratégique de la supply chain</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f2;color:#0c131f;font-family:"Segoe UI",Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px}h1{font-size:1.6rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tools button{border:2px solid #0088ce;background:white;color:#0072ad;border-radius:7px;padding:9px 13px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}.card{background:none;border:0;padding:0;perspective:1000px;height:240px;cursor:pointer;color:inherit;font:inherit;text-align:center}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;box-shadow:0 2px 8px #0002;padding:36px 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:auto}.front{background:#0c131f;color:white;font-weight:700;font-size:1.08rem}.back{background:white;border-top:6px solid #0088ce;transform:rotateY(180deg);font-size:1rem;line-height:1.45}.num{position:absolute;top:12px;left:14px;font-size:.75rem;font-weight:400;color:#b3b6bc}.hint{position:absolute;bottom:12px;font-size:.72rem;font-weight:400;color:#b3b6bc}.card:focus-visible{outline:3px solid #0088ce;outline-offset:4px;border-radius:12px}.return{color:#006ea8}@media(prefers-reduced-motion:reduce){.inner{transition:none}}</style></head><body><main><a class="return" href="index.html#veille">← Retour aux leçons</a><h1>L’analyse concurrentielle et le positionnement stratégique de la supply chain</h1><p>32 cartes recto verso · Cliquez ou utilisez Entrée / Espace.</p><div class="tools"><button data-action="all">Tout retourner</button><button data-action="reset">Tout remettre au recto</button><button data-action="shuffle">Mélanger</button></div><div class="grid"><button type="button" class="card" aria-pressed="false" aria-label="Concurrent direct"><span class="inner"><span class="face front"><span class="num">01</span><span>Concurrent direct</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Acteur qui partage le même périmètre géographique, le même segment de clientèle et une offre logistique substituable.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Concurrent indirect"><span class="inner"><span class="face front"><span class="num">02</span><span>Concurrent indirect</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Acteur qui répond au même besoin fondamental par un modèle différent.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Entrant potentiel"><span class="inner"><span class="face front"><span class="num">03</span><span>Entrant potentiel</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Acteur qui n&#x27;est pas encore présent sur le marché mais accumule des ressources, des partenariats ou des technologies pour y entrer.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Analyse concurrentielle supply chain"><span class="inner"><span class="face front"><span class="num">04</span><span>Analyse concurrentielle supply chain</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Dispositif permanent d’intelligence stratégique pour anticiper les ruptures, identifier les vulnérabilités et préparer un repositionnement.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Cartographie concurrentielle"><span class="inner"><span class="face front"><span class="num">05</span><span>Cartographie concurrentielle</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Outil qui permet de représenter les acteurs du marché logistique et de hiérarchiser les menaces.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Critère discriminant"><span class="inner"><span class="face front"><span class="num">06</span><span>Critère discriminant</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Critère qui permet de différencier réellement les acteurs entre eux par des variations de performance.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Couverture géographique"><span class="inner"><span class="face front"><span class="num">07</span><span>Couverture géographique</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Critère de cartographie qui peut être local, régional, national, européen ou mondial.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Modèle logistique"><span class="inner"><span class="face front"><span class="num">08</span><span>Modèle logistique</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Critère de cartographie qui peut être spécialisé, multi-services ou intégré.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Modèle logistique intégré"><span class="inner"><span class="face front"><span class="num">09</span><span>Modèle logistique intégré</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Architecture sous gouvernance unifiée qui couvre plusieurs fonctions logistiques et crée des avantages de coût, de réactivité et de traçabilité.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Fiche concurrentielle"><span class="inner"><span class="face front"><span class="num">10</span><span>Fiche concurrentielle</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Document structuré qui synthétise le périmètre logistique, les performances clés, les mouvements stratégiques et les signaux d’évolution d’un concurrent.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Signal faible"><span class="inner"><span class="face front"><span class="num">11</span><span>Signal faible</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Indice discret qui peut annoncer une évolution stratégique future, comme un recrutement, un brevet ou une levée de fonds.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="5 forces de Porter"><span class="inner"><span class="face front"><span class="num">12</span><span>5 forces de Porter</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Modèle qui analyse la rivalité, la menace des nouveaux entrants, le pouvoir des fournisseurs, le pouvoir des clients et la menace des substituts.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Rivalité entre concurrents existants"><span class="inner"><span class="face front"><span class="num">13</span><span>Rivalité entre concurrents existants</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Force de Porter visible dans les délais de livraison, les taux de service et les coûts logistiques comparés.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pouvoir de négociation des fournisseurs"><span class="inner"><span class="face front"><span class="num">14</span><span>Pouvoir de négociation des fournisseurs</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Force qui augmente quand l’organisation dépend de fournisseurs critiques ou uniques.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pouvoir de négociation des clients"><span class="inner"><span class="face front"><span class="num">15</span><span>Pouvoir de négociation des clients</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Force qui augmente quand les clients exigent plus de traçabilité, de délais garantis et de flexibilité.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Menace des substituts"><span class="inner"><span class="face front"><span class="num">16</span><span>Menace des substituts</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Force qui apparaît quand une fonction logistique est internalisée ou qu’une technologie réduit le besoin de transport et de stockage.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Matrice concurrentielle"><span class="inner"><span class="face front"><span class="num">17</span><span>Matrice concurrentielle</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Outil qui compare les acteurs sur des critères de performance logistique précis et pondérés.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Score pondéré"><span class="inner"><span class="face front"><span class="num">18</span><span>Score pondéré</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Résultat obtenu en multipliant le score d’un critère par son poids, puis en additionnant les résultats.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Auto-évaluation biaisée"><span class="inner"><span class="face front"><span class="num">19</span><span>Auto-évaluation biaisée</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Erreur qui consiste à surestimer sa propre performance sans base factuelle suffisante.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Écart structurel"><span class="inner"><span class="face front"><span class="num">20</span><span>Écart structurel</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Écart ancré dans le modèle économique, les actifs logistiques ou l’architecture informatique, donc durable.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Écart conjoncturel"><span class="inner"><span class="face front"><span class="num">21</span><span>Écart conjoncturel</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Écart lié à une cause temporaire ou cyclique, donc corrigeable sans transformation profonde.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Diagnostic comparatif"><span class="inner"><span class="face front"><span class="num">22</span><span>Diagnostic comparatif</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Synthèse qui relie benchmark concurrentiel et analyse des pressions pour juger la position de l’entreprise.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Écart prioritaire"><span class="inner"><span class="face front"><span class="num">23</span><span>Écart prioritaire</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Écart défavorable sur un critère fortement pondéré et exploité par les concurrents.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Option de repositionnement"><span class="inner"><span class="face front"><span class="num">24</span><span>Option de repositionnement</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Réponse stratégique déduite des écarts identifiés pour réduire une vulnérabilité ou créer un avantage.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Arbitrage multicritères"><span class="inner"><span class="face front"><span class="num">25</span><span>Arbitrage multicritères</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Comparaison de plusieurs scénarios selon des critères pondérés comme la faisabilité, le coût et l’impact concurrentiel.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Grille d’arbitrage"><span class="inner"><span class="face front"><span class="num">26</span><span>Grille d’arbitrage</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Outil qui rend explicites les critères, leurs poids et les scores attribués aux scénarios.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Recommandation stratégique"><span class="inner"><span class="face front"><span class="num">27</span><span>Recommandation stratégique</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Choix argumenté d’un scénario, avec conditions de mise en œuvre et points de vigilance.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Note de recommandation stratégique"><span class="inner"><span class="face front"><span class="num">28</span><span>Note de recommandation stratégique</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Document de synthèse orienté décision pour un comité de direction.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Indicateur de suivi"><span class="inner"><span class="face front"><span class="num">29</span><span>Indicateur de suivi</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Métrique qui permet de vérifier si la recommandation produit les effets attendus.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Objection anticipée"><span class="inner"><span class="face front"><span class="num">30</span><span>Objection anticipée</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Réserve probable du comité de direction qu’il faut préparer et traiter avec des arguments.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Fréquence d’actualisation"><span class="inner"><span class="face front"><span class="num">31</span><span>Fréquence d’actualisation</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Rythme de mise à jour de la cartographie ou de la veille, à calibrer selon la dynamique du marché.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Veille stratégique"><span class="inner"><span class="face front"><span class="num">32</span><span>Veille stratégique</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Collecte et exploitation de données sectorielles, financières et terrain pour alimenter l’analyse.</span></span></button></div></main><script>const grid=document.querySelector('.grid');function flip(c,f){c.classList.toggle('flipped',f);c.setAttribute('aria-pressed',String(f));c.querySelector('.front').setAttribute('aria-hidden',String(f));c.querySelector('.back').setAttribute('aria-hidden',String(!f));}Array.from(grid.children).forEach(c=>{flip(c,false);c.addEventListener('click',()=>flip(c,!c.classList.contains('flipped')))});document.querySelector('.tools').addEventListener('click',e=>{const a=e.target.dataset.action;let cs=Array.from(grid.children);if(a==='all'||a==='reset')cs.forEach(c=>flip(c,a==='all'));if(a==='shuffle'){for(let i=cs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}cs.forEach(c=>{flip(c,false);grid.appendChild(c)})}});</script></body></html>
