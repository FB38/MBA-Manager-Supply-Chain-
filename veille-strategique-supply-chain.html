<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veille stratégique Supply Chain</title>
<style>
:root{--red:#e2231a;--ink:#1e293b;--muted:#637083;--bg:#f3f5f8;--card:#fff;--shadow:0 14px 42px #1320381c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 10% 0,#fff 0,transparent 30%),var(--bg);color:var(--ink)}main{width:min(780px,calc(100% - 32px));margin:0 auto;padding:38px 0 28px}header{text-align:center;margin-bottom:25px}h1{font-size:clamp(1.35rem,4vw,2rem);line-height:1.2;margin:0 0 10px}.sub{margin:0;color:var(--muted);font-size:.98rem}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 11px;color:var(--muted);font-size:.9rem}.track{height:7px;background:#dde3ea;border-radius:99px;overflow:hidden;margin-bottom:20px}.fill{height:100%;width:0;background:var(--red);border-radius:99px;transition:width .25s}.card{height:350px;perspective:1200px;cursor:pointer;outline:none}.card:focus-visible .face{outline:3px solid #275fd2;outline-offset:3px}.inner{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s ease}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px;border-radius:22px;box-shadow:var(--shadow);backface-visibility:hidden;text-align:center;background:var(--card)}.back{transform:rotateY(180deg);background:#fff8f7}.badge{text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:700;color:var(--red);margin-bottom:24px}.content{font-size:clamp(1.22rem,3.5vw,1.8rem);line-height:1.42;font-weight:600;max-height:215px;overflow:auto}.hint{font-size:.86rem;color:var(--muted);margin-top:27px;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:11px;margin-top:20px}button{border:0;border-radius:11px;padding:13px 10px;font-size:.96rem;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 3px 10px #17203314;cursor:pointer}button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #275fd2;outline-offset:2px}.primary{background:var(--red);color:#fff}.footer{display:flex;justify-content:center;margin-top:21px}.small{font-size:.87rem;color:var(--muted);text-align:center}.shuffle{margin-top:14px;background:transparent;box-shadow:none;text-decoration:underline;color:var(--muted);font-size:.86rem;padding:5px}@media(max-width:530px){main{width:min(100% - 22px,780px);padding-top:22px}.card{height:390px}.face{padding:28px 23px}.actions{grid-template-columns:1fr 1fr}.primary{grid-column:1 / -1;grid-row:1}}
</style></head><body><main><header><h1>Veille stratégique Supply Chain</h1><p class="sub">Fiches de révision — aucun compte, aucune application nécessaire</p></header><div class="bar"><span id="progress"></span><span id="status">Question</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="card" id="card" tabindex="0" role="button" aria-label="Retourner la carte"><div class="inner"><section class="face"><div class="badge">Question</div><div class="content" id="front"></div><div class="hint">Cliquez pour afficher la réponse</div></section><section class="face back"><div class="badge">Réponse</div><div class="content" id="back"></div><div class="hint">Cliquez pour revenir à la question</div></section></div></div><div class="actions"><button id="prev" aria-label="Carte précédente">← Précédente</button><button class="primary" id="flip">Voir la réponse</button><button id="next" aria-label="Carte suivante">Suivante →</button></div><div class="footer"><button class="shuffle" id="shuffle">Mélanger les cartes</button></div><p class="small">Astuce : touches ← / → pour naviguer, espace ou Entrée pour retourner une carte.</p></main><script>
const originalCards=[["Recto", "Verso"], ["Qu'est-ce qu'un dispositif de veille stratégique en supply chain ?", "Un système structuré qui transforme l'information en intelligence décisionnelle pour anticiper les menaces et les opportunités."], ["Quel est l'objectif principal de la veille stratégique ?", "Anticiper les risques et les opportunités avant qu'ils ne s'imposent à l'entreprise."], ["Quels sont les 4 temps du cycle de veille ?", "Collecte, traitement, diffusion et pilotage."], ["À quoi sert la collecte ?", "À capter l'information pertinente depuis des sources variées."], ["À quoi sert le traitement ?", "À trier, qualifier, mettre en perspective et synthétiser les informations."], ["À quoi sert la diffusion ?", "À transmettre l'information utile aux bons décideurs, au bon moment."], ["À quoi sert le pilotage ?", "À évaluer, ajuster et faire durer le dispositif de veille."], ["Quels sont les 5 axes de veille ?", "Technologique, concurrentielle, réglementaire, sociétale et environnementale."], ["Que surveille la veille technologique ?", "Les innovations qui peuvent reconfigurer les produits ou les processus logistiques."], ["Que surveille la veille concurrentielle ?", "Les stratégies et mouvements des concurrents : acquisitions, intégrations verticales, repositionnements."], ["Que surveille la veille réglementaire ?", "Les évolutions légales et normatives qui impactent la supply chain."], ["Que surveille la veille sociétale ?", "Les attentes des parties prenantes sur les pratiques d'approvisionnement."], ["Que surveille la veille environnementale ?", "Les contraintes et opportunités liées au climat, aux ressources et à l'énergie."], ["Qu'est-ce qu'un signal faible ?", "Un indice précoce, isolé, qui peut révéler une tendance émergente."], ["Pourquoi faut-il hiérarchiser les sujets de veille ?", "Parce qu'on ne peut pas tout surveiller avec la même intensité ; il faut prioriser selon l'impact et la probabilité."], ["Qu'est-ce que la matrice de priorités ?", "Un outil qui croise impact potentiel et probabilité d'occurrence pour classer les sujets de veille."], ["Quelle erreur classique faut-il éviter en veille ?", "Vouloir tout couvrir avec la même intensité, ce qui crée une surveillance superficielle."], ["Que signifie un enjeu structurel ?", "Un facteur d'instabilité durable et profond, comme une dépendance fournisseur ou une concentration géographique."], ["Que signifie une alerte conjoncturelle ?", "Un signal ponctuel et temporaire, comme une grève ou un incident qualité."], ["Quelles sont les 4 briques du dispositif de veille ?", "Collecte, traitement, diffusion et pilotage."], ["Pourquoi ces briques sont-elles interdépendantes ?", "Parce qu'une collecte sans traitement produit du bruit, et qu'une diffusion sans pilotage perd sa valeur."], ["Quels acteurs internes jouent un rôle structurant dans la veille ?", "La direction générale, les achats et les opérations logistiques."], ["Quel est le rôle de la direction générale ?", "Fixer les orientations stratégiques et arbitrer les ressources."], ["Quel est le rôle des achats ?", "Capteur naturel des signaux liés aux fournisseurs et aux matières premières."], ["Quel est le rôle des opérations logistiques ?", "Apporter la connaissance des maillons critiques et des fragilités opérationnelles."], ["Quels sont les 3 niveaux de gouvernance de la veille ?", "Niveau stratégique, niveau de coordination et niveau opérationnel."], ["Quel est le rôle du niveau de coordination ?", "Animer le cycle de veille, consolider les contributions et produire les synthèses."], ["Pourquoi faut-il une charte de veille ?", "Pour formaliser qui collecte quoi, qui traite, qui reçoit et qui décide."], ["Pourquoi le dispositif de veille doit-il être dimensionné aux contraintes de l'ETI ?", "Parce qu'un dispositif trop lourd ne sera pas tenu, et qu'un dispositif trop léger sera peu utile."], ["Quel critère aide à prioriser les axes à outiller ?", "Le rapport effort-valeur."], ["Que compare le rapport effort-valeur ?", "Le bénéfice stratégique attendu et les ressources mobilisées."], ["Comment commence la montée en charge du dispositif ?", "Par un socle minimal avec deux ou trois axes prioritaires."], ["Pourquoi croiser veille technologique et veille concurrentielle ?", "Pour détecter les ruptures avant qu'elles ne transforment le marché."], ["Pourquoi la veille réglementaire est-elle stratégique ?", "Parce qu'elle permet d'anticiper les règles avant qu'elles deviennent contraignantes."], ["Quelle différence entre conformité et veille réglementaire ?", "La conformité respecte les règles en vigueur ; la veille réglementaire anticipe les règles à venir."], ["Pourquoi surveiller aussi les dimensions sociétale et environnementale ?", "Parce qu'elles annoncent souvent des attentes futures des clients, des donneurs d'ordre ou des régulateurs."], ["À quoi sert une stratégie de veille formalisée ?", "À rendre le dispositif lisible, actionnable et aligné sur les décisions à prendre."], ["Que doit contenir un document de stratégie de veille ?", "Le contexte, les axes de veille, les sources, les responsables, les fréquences et les circuits de diffusion."], ["Pourquoi définir des indicateurs de performance ?", "Pour vérifier que la veille crée réellement de la valeur décisionnelle."], ["Quel indicateur mesure le mieux l'impact de la veille ?", "Le nombre de décisions stratégiques alimentées par la veille."], ["Pourquoi une veille n'est-elle pas un simple système d'information ?", "Parce qu'elle ne stocke pas seulement des données : elle aide à décider et à anticiper."], ["Qu'est-ce qui distingue une veille réactive d'une veille stratégique ?", "La veille stratégique anticipe les ruptures au lieu de seulement répondre aux crises."], ["Pourquoi faut-il réviser régulièrement la stratégie de veille ?", "Parce que le contexte, les priorités et les besoins décisionnels évoluent."], ["Que signifie transformer le bruit informationnel en intelligence stratégique ?", "Filtrer l'information brute pour ne garder que ce qui éclaire une décision."]];let cards=[...originalCards],i=0,flipped=false;const card=document.querySelector('#card'),front=document.querySelector('#front'),back=document.querySelector('#back'),progress=document.querySelector('#progress'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),flip=document.querySelector('#flip');function render(){front.textContent=cards[i][0];back.textContent=cards[i][1];progress.textContent=`Carte ${i+1} sur ${cards.length}`;fill.style.width=`${((i+1)/cards.length)*100}%`;flipped=false;card.classList.remove('flipped');status.textContent='Question';flip.textContent='Voir la réponse'}function toggle(){flipped=!flipped;card.classList.toggle('flipped',flipped);status.textContent=flipped?'Réponse':'Question';flip.textContent=flipped?'Revoir la question':'Voir la réponse'}function move(n){i=(i+n+cards.length)%cards.length;render()}card.addEventListener('click',toggle);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});flip.onclick=toggle;document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#shuffle').onclick=()=>{for(let x=cards.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[cards[x],cards[y]]=[cards[y],cards[x]]}i=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}});render();
</script></body></html>
