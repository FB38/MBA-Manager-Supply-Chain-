<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La détection des signaux faibles et des tendances structurantes</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f2;color:#0c131f;font-family:"Segoe UI",Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px}h1{font-size:1.6rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tools button{border:2px solid #0088ce;background:white;color:#0072ad;border-radius:7px;padding:9px 13px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}.card{background:none;border:0;padding:0;perspective:1000px;height:240px;cursor:pointer;color:inherit;font:inherit;text-align:center}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;box-shadow:0 2px 8px #0002;padding:36px 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:auto}.front{background:#0c131f;color:white;font-weight:700;font-size:1.08rem}.back{background:white;border-top:6px solid #0088ce;transform:rotateY(180deg);font-size:1rem;line-height:1.45}.num{position:absolute;top:12px;left:14px;font-size:.75rem;font-weight:400;color:#b3b6bc}.hint{position:absolute;bottom:12px;font-size:.72rem;font-weight:400;color:#b3b6bc}.card:focus-visible{outline:3px solid #0088ce;outline-offset:4px;border-radius:12px}.return{color:#006ea8}@media(prefers-reduced-motion:reduce){.inner{transition:none}}</style></head><body><main><a class="return" href="index.html#veille">← Retour aux leçons</a><h1>La détection des signaux faibles et des tendances structurantes</h1><p>22 cartes recto verso · Cliquez ou utilisez Entrée / Espace.</p><div class="tools"><button data-action="all">Tout retourner</button><button data-action="reset">Tout remettre au recto</button><button data-action="shuffle">Mélanger</button></div><div class="grid"><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’un signal faible ?"><span class="inner"><span class="face front"><span class="num">01</span><span>Qu’est-ce qu’un signal faible ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Indice discret à faible visibilité, ambigu, mais au potentiel de transformation élevé et incertain.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une tendance structurante ?"><span class="inner"><span class="face front"><span class="num">02</span><span>Qu’est-ce qu’une tendance structurante ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Évolution plus visible, confirmée, avec un horizon d’impact opérationnel estimable sur la supply chain.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’un facteur de rupture ?"><span class="inner"><span class="face front"><span class="num">03</span><span>Qu’est-ce qu’un facteur de rupture ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Événement imprévisible, rapide et irréversible, capable de reconfigurer durablement les équilibres logistiques.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quel est l’objectif de la veille prospective ?"><span class="inner"><span class="face front"><span class="num">04</span><span>Quel est l’objectif de la veille prospective ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Anticiper les ruptures et saisir les opportunités avant les concurrents.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert le scanning environnemental ?"><span class="inner"><span class="face front"><span class="num">05</span><span>À quoi sert le scanning environnemental ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À organiser une surveillance systématique de l’environnement pour capter les signaux précoces.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quelles dimensions sont surveillées dans le cadre PESTEL ?"><span class="inner"><span class="face front"><span class="num">06</span><span>Quelles dimensions sont surveillées dans le cadre PESTEL ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Politique, Économique, Sociétale, Technologique, Environnementale et Légale.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pourquoi croiser plusieurs signaux ?"><span class="inner"><span class="face front"><span class="num">07</span><span>Pourquoi croiser plusieurs signaux ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Pour construire des scénarios prospectifs plus solides et éviter une lecture isolée des évolutions.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une analyse croisée des signaux ?"><span class="inner"><span class="face front"><span class="num">08</span><span>Qu’est-ce qu’une analyse croisée des signaux ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">La mise en relation de signaux issus de dimensions différentes pour repérer des convergences stratégiques.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert une matrice de qualification ?"><span class="inner"><span class="face front"><span class="num">09</span><span>À quoi sert une matrice de qualification ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À prioriser les signaux selon leur probabilité, leur impact potentiel et leur horizon temporel.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Que mesure une grille d’impact multi-dimensionnelle ?"><span class="inner"><span class="face front"><span class="num">10</span><span>Que mesure une grille d’impact multi-dimensionnelle ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Les effets concrets d’une évolution sur les flux, les coûts, les délais et la résilience.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pourquoi projeter les impacts dans le temps ?"><span class="inner"><span class="face front"><span class="num">11</span><span>Pourquoi projeter les impacts dans le temps ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Pour distinguer les effets à moyen et long terme et anticiper les changements du modèle logistique.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Que doit contenir un livrable prospectif efficace ?"><span class="inner"><span class="face front"><span class="num">12</span><span>Que doit contenir un livrable prospectif efficace ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une synthèse courte, hiérarchisée et actionnable pour aider la décision stratégique.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quel est le rôle du biais de confirmation ?"><span class="inner"><span class="face front"><span class="num">13</span><span>Quel est le rôle du biais de confirmation ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Il pousse à ne retenir que les informations qui confirment les hypothèses déjà formées.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce que le biais de disponibilité ?"><span class="inner"><span class="face front"><span class="num">14</span><span>Qu’est-ce que le biais de disponibilité ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">La tendance à surévaluer les événements récents, visibles ou médiatisés.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce que le biais d’ancrage ?"><span class="inner"><span class="face front"><span class="num">15</span><span>Qu’est-ce que le biais d’ancrage ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Le fait de rester bloqué sur la première information reçue malgré de nouveaux indices.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce que l’horizon temporel ?"><span class="inner"><span class="face front"><span class="num">16</span><span>Qu’est-ce que l’horizon temporel ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Le délai dans lequel une évolution peut produire un effet sur la supply chain.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Que signifie le degré de certitude ?"><span class="inner"><span class="face front"><span class="num">17</span><span>Que signifie le degré de certitude ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Le niveau de confiance accordé à un signal ou à une tendance.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quelle différence entre signal faible et tendance structurante ?"><span class="inner"><span class="face front"><span class="num">18</span><span>Quelle différence entre signal faible et tendance structurante ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Le signal faible est incertain et discret, la tendance structurante est plus confirmée et durable.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quelle différence entre tendance structurante et facteur de rupture ?"><span class="inner"><span class="face front"><span class="num">19</span><span>Quelle différence entre tendance structurante et facteur de rupture ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">La tendance se développe progressivement, la rupture surgit vite et désorganise fortement la chaîne.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pourquoi faut-il un processus d’escalade ?"><span class="inner"><span class="face front"><span class="num">20</span><span>Pourquoi faut-il un processus d’escalade ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Pour faire remonter les signaux critiques sans noyer la direction sous trop d’informations.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pourquoi faut-il éviter l’analyse séquentielle ?"><span class="inner"><span class="face front"><span class="num">21</span><span>Pourquoi faut-il éviter l’analyse séquentielle ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Parce qu’elle sous-estime les effets combinés de plusieurs évolutions simultanées.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quel est l’objectif de la synthèse exécutive ?"><span class="inner"><span class="face front"><span class="num">22</span><span>Quel est l’objectif de la synthèse exécutive ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Présenter les évolutions les plus critiques et les réponses prioritaires au comité de direction.</span></span></button></div></main><script>const grid=document.querySelector('.grid');function flip(c,f){c.classList.toggle('flipped',f);c.setAttribute('aria-pressed',String(f));c.querySelector('.front').setAttribute('aria-hidden',String(f));c.querySelector('.back').setAttribute('aria-hidden',String(!f));}Array.from(grid.children).forEach(c=>{flip(c,false);c.addEventListener('click',()=>flip(c,!c.classList.contains('flipped')))});document.querySelector('.tools').addEventListener('click',e=>{const a=e.target.dataset.action;let cs=Array.from(grid.children);if(a==='all'||a==='reset')cs.forEach(c=>flip(c,a==='all'));if(a==='shuffle'){for(let i=cs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}cs.forEach(c=>{flip(c,false);grid.appendChild(c)})}});</script></body></html>
