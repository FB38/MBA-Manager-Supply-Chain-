<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Détection des signaux faibles et tendances structurantes</title>
<style>
:root{--red:#e2231a;--ink:#1e293b;--muted:#637083;--bg:#f3f5f8;--card:#fff;--good:#087a54;--shadow:0 14px 42px #1320381c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 10% 0,#fff 0,transparent 30%),var(--bg);color:var(--ink)}main{width:min(780px,calc(100% - 32px));margin:0 auto;padding:38px 0 28px}header{text-align:center;margin-bottom:25px}h1{font-size:clamp(1.35rem,4vw,2rem);line-height:1.2;margin:0 0 10px}.sub{margin:0;color:var(--muted);font-size:.98rem}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 11px;color:var(--muted);font-size:.9rem}.track{height:7px;background:#dde3ea;border-radius:99px;overflow:hidden;margin-bottom:20px}.fill{height:100%;width:0;background:var(--red);border-radius:99px;transition:width .25s}.card{height:350px;perspective:1200px;cursor:pointer;outline:none}.card:focus-visible .face{outline:3px solid #275fd2;outline-offset:3px}.inner{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s ease}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px;border-radius:22px;box-shadow:var(--shadow);backface-visibility:hidden;text-align:center;background:var(--card)}.back{transform:rotateY(180deg);background:#fff8f7}.badge{text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:700;color:var(--red);margin-bottom:24px}.content{font-size:clamp(1.22rem,3.5vw,1.8rem);line-height:1.42;font-weight:600;max-height:215px;overflow:auto}.hint{font-size:.86rem;color:var(--muted);margin-top:27px;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:11px;margin-top:20px}button{border:0;border-radius:11px;padding:13px 10px;font-size:.96rem;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 3px 10px #17203314;cursor:pointer}button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #275fd2;outline-offset:2px}.primary{background:var(--red);color:#fff}.footer{display:flex;justify-content:center;gap:10px;margin-top:21px}.small{font-size:.87rem;color:var(--muted);text-align:center}.shuffle{margin-top:14px;background:transparent;box-shadow:none;text-decoration:underline;color:var(--muted);font-size:.86rem;padding:5px}@media(max-width:530px){main{width:min(100% - 22px,780px);padding-top:22px}.card{height:390px}.face{padding:28px 23px}.actions{grid-template-columns:1fr 1fr}.primary{grid-column:1 / -1;grid-row:1}}
</style></head><body><main><header><h1>Détection des signaux faibles et tendances structurantes</h1><p class="sub">Fiches de révision — aucun compte, aucune application nécessaire</p></header><div class="bar"><span id="progress"></span><span id="status">Question</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="card" id="card" tabindex="0" role="button" aria-label="Retourner la carte"><div class="inner"><section class="face"><div class="badge">Question</div><div class="content" id="front"></div><div class="hint">Cliquez pour afficher la réponse</div></section><section class="face back"><div class="badge">Réponse</div><div class="content" id="back"></div><div class="hint">Cliquez pour revenir à la question</div></section></div></div><div class="actions"><button id="prev" aria-label="Carte précédente">← Précédente</button><button class="primary" id="flip">Voir la réponse</button><button id="next" aria-label="Carte suivante">Suivante →</button></div><div class="footer"><button class="shuffle" id="shuffle">Mélanger les cartes</button></div><p class="small">Astuce : touches ← / → pour naviguer, espace ou Entrée pour retourner une carte.</p></main><script>
const originalCards=[["Qu’est-ce qu’un signal faible ?", "Indice discret à faible visibilité, ambigu, mais au potentiel de transformation élevé et incertain."], ["Qu’est-ce qu’une tendance structurante ?", "Évolution plus visible, confirmée, avec un horizon d’impact opérationnel estimable sur la supply chain."], ["Qu’est-ce qu’un facteur de rupture ?", "Événement imprévisible, rapide et irréversible, capable de reconfigurer durablement les équilibres logistiques."], ["Quel est l’objectif de la veille prospective ?", "Anticiper les ruptures et saisir les opportunités avant les concurrents."], ["À quoi sert le scanning environnemental ?", "À organiser une surveillance systématique de l’environnement pour capter les signaux précoces."], ["Quelles dimensions sont surveillées dans le cadre PESTEL ?", "Politique, Économique, Sociétale, Technologique, Environnementale et Légale."], ["Pourquoi croiser plusieurs signaux ?", "Pour construire des scénarios prospectifs plus solides et éviter une lecture isolée des évolutions."], ["Qu’est-ce qu’une analyse croisée des signaux ?", "La mise en relation de signaux issus de dimensions différentes pour repérer des convergences stratégiques."], ["À quoi sert une matrice de qualification ?", "À prioriser les signaux selon leur probabilité, leur impact potentiel et leur horizon temporel."], ["Que mesure une grille d’impact multi-dimensionnelle ?", "Les effets concrets d’une évolution sur les flux, les coûts, les délais et la résilience."], ["Pourquoi projeter les impacts dans le temps ?", "Pour distinguer les effets à moyen et long terme et anticiper les changements du modèle logistique."], ["Que doit contenir un livrable prospectif efficace ?", "Une synthèse courte, hiérarchisée et actionnable pour aider la décision stratégique."], ["Quel est le rôle du biais de confirmation ?", "Il pousse à ne retenir que les informations qui confirment les hypothèses déjà formées."], ["Qu’est-ce que le biais de disponibilité ?", "La tendance à surévaluer les événements récents, visibles ou médiatisés."], ["Qu’est-ce que le biais d’ancrage ?", "Le fait de rester bloqué sur la première information reçue malgré de nouveaux indices."], ["Qu’est-ce que l’horizon temporel ?", "Le délai dans lequel une évolution peut produire un effet sur la supply chain."], ["Que signifie le degré de certitude ?", "Le niveau de confiance accordé à un signal ou à une tendance."], ["Quelle différence entre signal faible et tendance structurante ?", "Le signal faible est incertain et discret, la tendance structurante est plus confirmée et durable."], ["Quelle différence entre tendance structurante et facteur de rupture ?", "La tendance se développe progressivement, la rupture surgit vite et désorganise fortement la chaîne."], ["Pourquoi faut-il un processus d’escalade ?", "Pour faire remonter les signaux critiques sans noyer la direction sous trop d’informations."], ["Pourquoi faut-il éviter l’analyse séquentielle ?", "Parce qu’elle sous-estime les effets combinés de plusieurs évolutions simultanées."], ["Quel est l’objectif de la synthèse exécutive ?", "Présenter les évolutions les plus critiques et les réponses prioritaires au comité de direction."]];let cards=[...originalCards],i=0,flipped=false;
const card=document.querySelector('#card'),front=document.querySelector('#front'),back=document.querySelector('#back'),progress=document.querySelector('#progress'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),flip=document.querySelector('#flip');
function render(){front.textContent=cards[i][0];back.textContent=cards[i][1];progress.textContent=`Carte ${i+1} sur ${cards.length}`;fill.style.width=`${((i+1)/cards.length)*100}%`;flipped=false;card.classList.remove('flipped');status.textContent='Question';flip.textContent='Voir la réponse'}
function toggle(){flipped=!flipped;card.classList.toggle('flipped',flipped);status.textContent=flipped?'Réponse':'Question';flip.textContent=flipped?'Revoir la question':'Voir la réponse'}
function move(n){i=(i+n+cards.length)%cards.length;render()}card.addEventListener('click',toggle);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});flip.onclick=toggle;document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#shuffle').onclick=()=>{for(let x=cards.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[cards[x],cards[y]]=[cards[y],cards[x]]}i=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}});render();
</script></body></html>
