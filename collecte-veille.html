<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La collecte, la qualification et l’exploitation des données de veille</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f2;color:#0c131f;font-family:"Segoe UI",Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px}h1{font-size:1.6rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tools button{border:2px solid #0088ce;background:white;color:#0072ad;border-radius:7px;padding:9px 13px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}.card{background:none;border:0;padding:0;perspective:1000px;height:240px;cursor:pointer;color:inherit;font:inherit;text-align:center}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;box-shadow:0 2px 8px #0002;padding:36px 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:auto}.front{background:#0c131f;color:white;font-weight:700;font-size:1.08rem}.back{background:white;border-top:6px solid #0088ce;transform:rotateY(180deg);font-size:1rem;line-height:1.45}.num{position:absolute;top:12px;left:14px;font-size:.75rem;font-weight:400;color:#b3b6bc}.hint{position:absolute;bottom:12px;font-size:.72rem;font-weight:400;color:#b3b6bc}.card:focus-visible{outline:3px solid #0088ce;outline-offset:4px;border-radius:12px}.return{color:#006ea8}@media(prefers-reduced-motion:reduce){.inner{transition:none}}</style></head><body><main><a class="return" href="index.html#veille">← Retour aux leçons</a><h1>La collecte, la qualification et l’exploitation des données de veille</h1><p>18 cartes recto verso · Cliquez ou utilisez Entrée / Espace.</p><div class="tools"><button data-action="all">Tout retourner</button><button data-action="reset">Tout remettre au recto</button><button data-action="shuffle">Mélanger</button></div><div class="grid"><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une source formelle de veille ?"><span class="inner"><span class="face front"><span class="num">01</span><span>Qu’est-ce qu’une source formelle de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une publication institutionnelle ou une base sectorielle. Elle est fiable, mais parfois plus lente.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une source informelle de veille ?"><span class="inner"><span class="face front"><span class="num">02</span><span>Qu’est-ce qu’une source informelle de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une remontée terrain, un échange en salon ou une conversation avec un fournisseur. Elle capte des signaux faibles.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une source experte ?"><span class="inner"><span class="face front"><span class="num">03</span><span>Qu’est-ce qu’une source experte ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une source produite par un analyste, un consultant ou un chercheur. Elle combine méthode et proximité avec les évolutions du secteur.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Pourquoi faut-il combiner plusieurs types de sources ?"><span class="inner"><span class="face front"><span class="num">04</span><span>Pourquoi faut-il combiner plusieurs types de sources ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Parce qu’aucune catégorie ne couvre seule un axe de surveillance. La complémentarité réduit les angles morts.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert un agrégateur RSS ?"><span class="inner"><span class="face front"><span class="num">05</span><span>À quoi sert un agrégateur RSS ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À centraliser les flux de contenu issus de sources web identifiées. Il ne filtre pas le contenu.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quel est le rôle d’une plateforme d’IA de curation ?"><span class="inner"><span class="face front"><span class="num">06</span><span>Quel est le rôle d’une plateforme d’IA de curation ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Elle analyse les contenus collectés, les classe selon des critères de pertinence et priorise les informations.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quels sont les 4 critères de qualification d’une information de veille ?"><span class="inner"><span class="face front"><span class="num">07</span><span>Quels sont les 4 critères de qualification d’une information de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Fiabilité, fraîcheur, pertinence et actionnabilité.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’un signal brut ?"><span class="inner"><span class="face front"><span class="num">08</span><span>Qu’est-ce qu’un signal brut ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une information collectée sans recoupement ni contextualisation.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’une donnée vérifiée ?"><span class="inner"><span class="face front"><span class="num">09</span><span>Qu’est-ce qu’une donnée vérifiée ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une information recoupée, validée et contextualisée, donc partageable aux équipes concernées.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’un insight exploitable ?"><span class="inner"><span class="face front"><span class="num">10</span><span>Qu’est-ce qu’un insight exploitable ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Une information qualifiée, enrichie d’analyse et accompagnée d’une recommandation d’action.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Combien de sources indépendantes faut-il pour valider une information ?"><span class="inner"><span class="face front"><span class="num">11</span><span>Combien de sources indépendantes faut-il pour valider une information ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Au moins deux sources indépendantes.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Qu’est-ce qu’un workflow de qualification ?"><span class="inner"><span class="face front"><span class="num">12</span><span>Qu’est-ce qu’un workflow de qualification ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Un processus formalisé en trois étapes : tri initial, validation par recoupement, enrichissement contextuel.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert une note flash ?"><span class="inner"><span class="face front"><span class="num">13</span><span>À quoi sert une note flash ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À signaler un événement ponctuel à fort impact, avec une recommandation d’action immédiate.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert un bulletin périodique ?"><span class="inner"><span class="face front"><span class="num">14</span><span>À quoi sert un bulletin périodique ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À regrouper les signaux qualifiés sur une période donnée et à donner une lecture transversale.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="À quoi sert un tableau de bord de veille ?"><span class="inner"><span class="face front"><span class="num">15</span><span>À quoi sert un tableau de bord de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">À visualiser rapidement l’état des axes de surveillance prioritaires.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quel est le rôle de la gouvernance de l’information de veille ?"><span class="inner"><span class="face front"><span class="num">16</span><span>Quel est le rôle de la gouvernance de l’information de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Elle définit qui produit, qui valide, qui reçoit et comment protéger les informations sensibles.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Quels sont les 3 indicateurs de performance du dispositif de veille ?"><span class="inner"><span class="face front"><span class="num">17</span><span>Quels sont les 3 indicateurs de performance du dispositif de veille ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">Taux de couverture, délai de traitement et taux d’exploitation.</span></span></button><button type="button" class="card" aria-pressed="false" aria-label="Que mesure le taux d’exploitation ?"><span class="inner"><span class="face front"><span class="num">18</span><span>Que mesure le taux d’exploitation ?</span><span class="hint">Cliquer pour retourner</span></span><span class="face back">La proportion d’informations qualifiées réellement utilisées dans une décision ou une action.</span></span></button></div></main><script>const grid=document.querySelector('.grid');function flip(c,f){c.classList.toggle('flipped',f);c.setAttribute('aria-pressed',String(f));c.querySelector('.front').setAttribute('aria-hidden',String(f));c.querySelector('.back').setAttribute('aria-hidden',String(!f));}Array.from(grid.children).forEach(c=>{flip(c,false);c.addEventListener('click',()=>flip(c,!c.classList.contains('flipped')))});document.querySelector('.tools').addEventListener('click',e=>{const a=e.target.dataset.action;let cs=Array.from(grid.children);if(a==='all'||a==='reset')cs.forEach(c=>flip(c,a==='all'));if(a==='shuffle'){for(let i=cs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}cs.forEach(c=>{flip(c,false);grid.appendChild(c)})}});</script></body></html>
